
name: build-3dsx
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: make
      - uses: actions/upload-artifact@v4
        with:
          name: AnimatedWallpaper3DS
          path: |
            AnimatedWallpaper3DS.3dsx
            sdroot/**
